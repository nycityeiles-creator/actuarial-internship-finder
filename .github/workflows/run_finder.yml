name: Actuarial Internship Finder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run internship finder
        run: python internship_finder.py
